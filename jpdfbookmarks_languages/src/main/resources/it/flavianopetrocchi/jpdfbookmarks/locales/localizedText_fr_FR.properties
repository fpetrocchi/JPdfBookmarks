AI_CLOUD_HTTP_UPSTREAM_OPENAI_HINT=L'erreur JSON indique qu'OpenAI a rejeté la requête de votre Edge Function (souvent HTTP 401 : autorisations insuffisantes, scopes comme model.request manquants, ou clé API en lecture seule). Corrigez cela côté serveur : définissez OPENAI_API_KEY (ou votre secret) avec une clé de https://platform.openai.com/api-keys autorisée pour le modèle appelé, ou ajustez les rôles d'organisation/projet. Il ne s'agit pas de la clé anon Supabase des options JPdfBookmarks.
