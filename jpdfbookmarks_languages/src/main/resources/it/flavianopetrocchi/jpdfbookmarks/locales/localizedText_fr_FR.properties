MSG_READONLY=Le fichier est en LECTURE SEULE ; vous ne pourrez pas l'enregistrer, mais vous pouvez tout de même exporter les signets vers un fichier texte
READONLY=LECTURE SEULE
ACTION_COPY_BOOKMARK_FROM_VIEW=Copier depuis la vue
ACTION_COPY_BOOKMARK_FROM_VIEW_DESCR=Copier la vue actuelle vers le presse-papiers local sous forme de signet, utile si vous voulez créer un signet dans un autre PDF lié
KEEP_PAGE_NUMBERS=Vous avez sélectionné plusieurs signets. Voulez-vous conserver la page cible d'origine des signets ?
