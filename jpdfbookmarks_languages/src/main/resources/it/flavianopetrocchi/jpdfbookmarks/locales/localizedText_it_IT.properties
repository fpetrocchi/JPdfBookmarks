AI_INDEX_DIALOG_TITLE=Estrai segnalibri dall'indice (IA)
AI_INDEX_INTRO=Questo strumento legge l'<b>indice stampato</b> nel PDF e crea i segnalibri usando l'<b>Intelligenza Artificiale</b>.<br><br>Puoi <b>lasciare aperta questa finestra</b> mentre scorri il documento nella finestra principale per capire dove inizia e finisce l'indice. Imposta le pagine qui sotto, poi clicca <b>Analizza</b>. A elaborazione terminata potrai unire il risultato nell'albero dei segnalibri. Chiudi questa finestra quando non ti serve pi\u00f9.
AI_INDEX_DESTINATION_NOTE=I segnalibri creati punteranno per impostazione predefinita all'inizio della pagina del PDF che contiene ciascun titolo, con visualizzazione <b>Adatta Larghezza</b>. Lo scostamento dei numeri di pagina di destinazione e tutte le altre propriet\u00e0 dei segnalibri potranno essere modificati in seguito con gli strumenti di JPdfBookmarks.
AI_INDEX_SECTION_RANGE=Pagine dell'indice e correzione numeri
AI_INDEX_START_PAGE=Prima pagina dell'indice
AI_INDEX_START_PAGE_HINT=La prima pagina del PDF in cui compare l'indice (usa gli stessi numeri che vedi nella barra di stato o nella navigazione pagine).
AI_INDEX_END_PAGE=Ultima pagina dell'indice
AI_INDEX_END_PAGE_HINT=L'ultima pagina che fa ancora parte dell'indice. Se l'indice occupa pi\u00f9 pagine consecutive, includi tutto l'intervallo.
AI_INDEX_PAGE_OFFSET=Scostamento numeri di pagina (opzionale)
AI_INDEX_PAGE_OFFSET_HINT=Questo valore viene <b>sommato</b> a ogni numero di pagina restituito dall'IA. Lascia 0 se i numeri stampati coincidono con il PDF. Usa un valore positivo o negativo quando differiscono (es. prefazione con numerazione romana o copertine non numerate).
AI_INDEX_CLOSE=Chiudi
AI_INDEX_ANALYZE=Analizza
AI_INDEX_NO_DOCUMENT=Nessun documento PDF aperto.
AI_INDEX_BAD_RANGE=La pagina iniziale non pu\u00f2 essere maggiore della pagina finale.
AI_INDEX_ERROR_TITLE=Estrazione indice (IA)
AI_INDEX_UNEXPECTED_ERROR=Si \u00e8 verificato un errore imprevisto.
AI_INDEX_NO_BOOKMARKS_EXTRACTED=Nessun segnalibro estratto.
AI_INDEX_MERGE_PROMPT=Come applicare i segnalibri estratti?
AI_INDEX_MERGE_APPEND=Aggiungi in coda ai segnalibri esistenti
AI_INDEX_MERGE_REPLACE=Sostituisci tutti i segnalibri
AI_INDEX_SET_CURRENT_START_TIP=Imposta questo campo alla pagina del PDF attualmente mostrata nel visualizzatore principale (numero di pagina 1-based).
AI_INDEX_SET_CURRENT_END_TIP=Imposta questo campo alla pagina del PDF attualmente mostrata nel visualizzatore principale (numero di pagina 1-based).
AI_INDEX_SET_CURRENT_NO_VIEW=Nessun visualizzatore PDF disponibile. Imposta le pagine manualmente con gli spinner.
AI_INDEX_SET_CURRENT_NO_PAGE=Il visualizzatore non ha segnalato un numero di pagina valido.
AI_INDEX_SET_CURRENT_CLAMPED=Il visualizzatore \u00e8 sulla pagina %d, fuori dall'intervallo consentito; il campo \u00e8 stato impostato a %d.
AI_INDEX_CLOUD_NO_TASK_ID=Il servizio cloud non ha restituito un id attività. Controlla la risposta di process-index e la Edge Function.
AI_INDEX_CLOUD_PREVIEW_NOTE=L'estrazione cloud ha limiti pi\u00f9 stretti per richiesta. Se selezioni pi\u00f9 di {0} pagine d'indice, ti verr\u00e0 chiesto di restringere l'intervallo (anteprima gratuita e protezione server).
AI_INDEX_CLOUD_PAGE_LIMIT_CONFIRM=L'intervallo dell'indice che hai impostato copre {0} pagine. In modalit\u00e0 cloud questo passaggio gratuito analizza solo le prime {1} pagine dell'intervallo (pagine PDF {2}–{3}). Dopo il pagamento sar\u00e0 disponibile la struttura completa dei segnalibri per tutto l'indice indicato. Continuare?
AI_INDEX_CLOUD_CONSENT_MESSAGE=Le pagine dell'indice selezionate saranno inviate a un server esterno per l'elaborazione IA.<br><br>JPdfBookmarks carica un'immagine delle pagine selezionate e l'eventuale testo estratto da tali pagine. Continua solo se sei autorizzato a inviare il contenuto di questo documento a un servizio di terze parti.
AI_INDEX_CLOUD_CONSENT_REMEMBER=Non chiedere pi\u00f9 su questo dispositivo per l'estrazione cloud dell'indice
AI_INDEX_CLOUD_CONSENT_CONTINUE=Invia al cloud
AI_INDEX_CLOUD_CONSENT_PRIVACY_BUTTON=Informativa privacy
