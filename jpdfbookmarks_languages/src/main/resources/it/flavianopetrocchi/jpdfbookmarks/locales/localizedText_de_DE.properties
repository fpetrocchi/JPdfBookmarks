AI_CLOUD_HTTP_401_HINT=Der Server hat den Schlüssel abgelehnt (401). Kopieren Sie im Supabase Dashboard → Project Settings → API den anon public-Schlüssel erneut in die Optionen. Stellen Sie Bearer nicht voran (die App fügt es selbst hinzu). Wenn Sie die Schlüssel rotiert haben, aktualisieren Sie auch den gespeicherten Wert.
AI_CLOUD_HTTP_UPSTREAM_OPENAI_HINT=Der JSON-Fehler zeigt, dass OpenAI die Anfrage Ihrer Edge Function abgelehnt hat (häufig HTTP 401: unzureichende Berechtigungen, fehlende Scopes wie model.request oder ein API-Schlüssel mit Nur-Lese-Rolle). Beheben Sie dies serverseitig: setzen Sie OPENAI_API_KEY (oder Ihr Secret) auf einen Schlüssel von https://platform.openai.com/api-keys mit Zugriff auf das verwendete Modell oder passen Sie Organisations-/Projektrollen an. Dies ist nicht der Supabase-anon-Schlüssel in den JPdfBookmarks-Optionen.
AI_OPTIONS_CLOUD_CHECK_URL=URL zur Zahlungsprüfung (optional)
AI_OPTIONS_CLOUD_FETCH_FULL_URL=URL zum Abrufen vollständiger Ergebnisse (nach Zahlung)
AI_OPTIONS_CLOUD_STRIPE_MINI_URL=Stripe-Checkout-URL (Standard)
AI_OPTIONS_CLOUD_STRIPE_ADVANCED_URL=Stripe-Checkout-URL (Advanced)
AI_OPTIONS_CLOUD_STRIPE_ADVANCED_HINT=Diese URL sollte auf Ihr Stripe-Advanced-Preis-/Produkt zeigen. Der Server-Webhooks ordnet Advanced über STRIPE_ADVANCED_PRICE_IDS und Preis-Metadaten zu; diese müssen mit dem Checkout übereinstimmen, den Sie von hier aus öffnen.
AI_OPTIONS_CLOUD_STRIPE_PRICES_URL=URL des Stripe-Preiskatalogs (optional)
AI_OPTIONS_CLOUD_STRIPE_PRICES_HINT=Wenn gesetzt, führt die App eine GET-Anfrage an diese URL aus (mit denselben Supabase Bearer- und apikey-Headern) und erwartet JSON wie { "standard": { "unit_amount": 115, "currency": "eur" }, "advanced": { "unit_amount": 355, "currency": "eur" } } (Stripe-ähnliche Kleinsteinheiten). Implementieren Sie dies als Edge Function, die Ihre Stripe-Preise mit dem Secret-Key liest, damit die angezeigten Beträge ohne neues JAR aktualisiert werden. Lassen Sie das Feld leer, um die festen Zeichenketten AI_PREVIEW_STANDARD_PRICE / AI_PREVIEW_ADVANCED_PRICE aus diesem Sprachpaket zu verwenden. Wenn es leer ist und die Check payment-URL auf …/check-payment endet, verwendet die App automatisch denselben Host mit …/stripe-catalog-prices.
AI_OPTIONS_CLOUD_PROCESS_MODEL=Cloud-Extraktionsmodell (process-index)
AI_OPTIONS_CLOUD_URL_HINT=Verwenden Sie vollständige HTTPS-URLs zu Ihren Edge Functions. Der anon-Schlüssel wird als Bearer- und apikey-Header gesendet.
AI_ERROR_CLOUD_EXTRACTION_HINT=Cloud-Extraktion ist ausgewählt, aber die process-URL oder der anon-Schlüssel ist leer. Vervollständigen Sie den Cloud-Bereich in den Optionen (Künstliche Intelligenz) oder wechseln Sie zurück zu Lokal.
AI_PREVIEW_WINDOW_TITLE=KI-Lesezeichenvorschau
AI_PREVIEW_INDEX_PANEL_TITLE=Indexvorschau
AI_PREVIEW_TREE_ROOT=Index
AI_PREVIEW_CARD_STANDARD_TITLE=Standard-KI-Modell
AI_PREVIEW_CARD_STANDARD_BODY=Die KI hat Lesezeichen aus den Vorschau-Indexseiten erstellt. Etwa 30 % sind im Baum sichtbar: Klicken Sie auf einen Eintrag, um zu dieser Seite im Viewer zu springen. Nach der Zahlung erhalten Sie die vollständige Gliederung für den ursprünglich ausgewählten Indexseitenbereich.
AI_PREVIEW_LOCKED_NODE=*** Kaufen zum Entsperren ***
AI_PREVIEW_CARD_ADVANCED_TITLE=Erweitertes KI-Modell
AI_PREVIEW_CARD_ADVANCED_BODY=Für sehr dichte oder komplexe Indizes oder wenn Sie die beste Extraktionsqualität möchten, wählen Sie das erweiterte KI-Modell.
AI_PREVIEW_STANDARD_PRICE=1,15 €
AI_PREVIEW_ADVANCED_PRICE=3,55 €
AI_PREVIEW_BTN_STANDARD=Vollständige Gliederung freischalten
AI_PREVIEW_BTN_ADVANCED=Mit erweiterter KI kaufen
AI_PREVIEW_CLOSE=Schließen
AI_PREVIEW_POLLING=Zahlung wird alle 5 Sekunden geprüft…
AI_PREVIEW_POLLING_DISABLED=Konfigurieren Sie die check-payment-URL in den Optionen, um die automatische Prüfung zu aktivieren. Eine separate fetch-full-results-URL wird nur benötigt, wenn Ihr Server bei bezahltem Status keine Lesezeichen in der check-payment-Antwort zurückgibt.
AI_PREVIEW_PAID_NO_BOOKMARKS_NO_FETCH=Zahlung bestätigt, aber der Server hat keine Lesezeichen zurückgegeben und es ist keine fetch-full-results-URL konfiguriert. Fügen Sie sie in den Optionen hinzu oder korrigieren Sie check-payment so, dass bei paid=true die Lesezeichen zurückgegeben werden.
AI_PREVIEW_FETCH_EMPTY=Der Server hat für diese Aufgabe keine Lesezeichen zurückgegeben.
AI_PREVIEW_PAYMENT_DETECTED=Zahlung bestätigt. Vollständige Lesezeichen werden heruntergeladen…
AI_PREVIEW_WAIT_TASK_TOOLTIP=Warten auf die task id vom Cloud-Dienst.
AI_PREVIEW_STRIPE_URL_MISSING_TOOLTIP=Konfigurieren Sie die Stripe-Checkout-URL in den Optionen (Künstliche Intelligenz).
AI_PREVIEW_MISSING_TASK_ID=Die Cloud-Antwort enthält keine taskId. Konfigurieren Sie process-index so, dass sie zurückgegeben wird; ohne sie kann Stripe die Zahlung nicht dieser Extraktion zuordnen und die Schaltflächen bleiben deaktiviert.
AI_PREVIEW_STATUS_NO_TASK=Die Zahlung kann erst geprüft werden, wenn eine task id verfügbar ist.
AI_PREVIEW_CHECKING_SERVER=Auf dem Server wird geprüft, ob diese Extraktion bereits bezahlt ist…
AI_PREVIEW_CHECKING_SERVER_STATUS=Server wird nach dem Zahlungsstatus gefragt…
AI_PREVIEW_ALREADY_PAID_STATUS=Diese Extraktion ist auf dem Server bereits als bezahlt markiert. Sie können die gekauften Lesezeichen herunterladen.
AI_PREVIEW_ALREADY_PAID_DOWNLOAD_HINT=Der Baum links zeigt die vollständige Gliederung. Klicken Sie auf die Schaltfläche, um diese Lesezeichen auf das PDF anzuwenden (Sie werden gefragt, ob sie angehängt oder den aktuellen Baum ersetzen sollen).
AI_PREVIEW_BTN_DOWNLOAD_PURCHASED=Gekaufte Lesezeichen herunterladen
AI_PREVIEW_UPGRADE_STANDARD_HINT=Für diese Extraktion haben Sie bereits die Standard-Stufe freigeschaltet. Laden Sie die Gliederung jetzt herunter oder wechseln Sie zur Advanced-Stufe für eine zusätzliche KI-Verfeinerung (separate Zahlung). Warten Sie nach der Advanced-Zahlung einige Sekunden; dieses Fenster aktualisiert sich automatisch.
AI_PREVIEW_BTN_UPGRADE_ADVANCED=Auf erweiterte KI upgraden
AI_PREVIEW_BTN_ACCEPT_STANDARD_PAID=Bezahlten Standard-Index verwenden
AI_PREVIEW_UPGRADE_POLLING_STATUS=Warten auf die Serverbestätigung des Advanced-Upgrades…
AI_PREVIEW_UPGRADE_COMPLETE_STATUS=Advanced-Upgrade erkannt. Laden Sie die verfeinerte Gliederung herunter, wenn Sie bereit sind.
AI_PREVIEW_PAID_EMPTY_BOOKMARKS_HINT=Die Zahlung ist erfasst, aber es wurde keine Lesezeichenliste zurückgegeben. Versuchen Sie die Schaltfläche unten, wenn Sie eine separate URL für vollständige Ergebnisse konfiguriert haben.
AI_PREVIEW_FETCH_URL_REQUIRED_TOOLTIP=Konfigurieren Sie die fetch-full-results-URL in den Optionen.
AI_PREVIEW_REEXTRACT_FULL_INDEX_STATUS=Vollständiger Index wird aus allen ausgewählten Seiten extrahiert (dies kann etwas dauern)…
AI_PREVIEW_REEXTRACT_FAILED=Der vollständige Index konnte nicht vom Server geladen werden. Stattdessen werden die Lesezeichen aus der Vorschau-Extraktion angewendet.
CHOOSE_NUM_CLICKS=Wählen Sie Einfach- oder Doppelklick zum Aktivieren von Lesezeichen
SINGLE_CLICK=Einfachklick
DOUBLE_CLICK=Doppelklick
ACTION_OPEN_LINKED_PDF=Verknüpftes PDF öffnen ...
ACTION_OPEN_LINKED_PDF_DESCR=Eine PDF-Datei in einem anderen Fenster öffnen, um sie mit dem in diesem Fenster geöffneten PDF zu verknüpfen
MENU_OPEN_LINKED_PDF_MENMONIC=L
INSERT_NEW_TITLE=Geben Sie den neuen Titel der Lesezeichen ein:
ERROR_WRONG_PASSWORD=Passwort fehlt oder ist falsch
LABEL_OWNER_PASSWORD=Besitzer-Passwort:
DIALOG_OWNER_PASSWORD=Diese Datei benötigt ein Passwort, um bearbeitet zu werden
INPUT_PASSWORD=Passwort:
DIALOG_USER_PASSWORD=Diese Datei benötigt ein Passwort, um geöffnet zu werden
MSG_READONLY=Die Datei ist SCHREIBGESCHÜTZT; Sie können sie nicht speichern, aber Sie können die Lesezeichen dennoch in eine Textdatei exportieren
READONLY=SCHREIBGESCHÜTZT
ACTION_COPY_BOOKMARK_FROM_VIEW=Aus Ansicht kopieren
ACTION_COPY_BOOKMARK_FROM_VIEW_DESCR=Aktuelle Ansicht als Lesezeichen in die lokale Zwischenablage kopieren; nützlich, wenn Sie in einem anderen verknüpften PDF ein Lesezeichen erstellen möchten
KEEP_PAGE_NUMBERS=Sie haben mehrere Lesezeichen ausgewählt. Möchten Sie die ursprüngliche Zielseite der Lesezeichen beibehalten?
AGREE=Zustimmen
