
APP_DESCR=\nUtilidad para crear o editar marcadores en archivos PDF existentes. Para iniciar la interfaz gráfica, ejecútela sin parámetros o pase como parámetro un archivo PDF. En Windows, el programa de línea de comandos debe llamarse con jpdfbookmarks_cli.exe, mientras que la interfaz gráfica debe llamarse con jpdfbookmarks.exe.\n
DUMP_DESCR=Extrae los marcadores de un archivo PDF pasado como argumento y los imprime en la salida estándar o en un archivo indicado con la opción --out. La codificación del archivo de texto puede cambiarse con la opción --encoding.
APPLY_DESCR=Aplica los marcadores del archivo bookmarks.txt a un archivo PDF pasado como argumento y lo guarda en un nuevo PDF indicado con --out output.pdf. La codificación para leer el archivo bookmarks.txt puede cambiarse con la opción --encoding.
OUT_DESCR=Usado con la opción --apply indica el archivo PDF de salida (--out file.pdf o -o file.pdf). Usado con la opción --dump puede indicar el archivo de marcadores de salida (--out bookmarks.txt o -o bookmarks.txt), y puede usarse junto con la opción --encoding para reemplazar la codificación predeterminada del sistema para el archivo de texto.
BOOKMARKS_DESCR=\nEn el archivo bookmarks.txt cada línea es un marcador y la jerarquía se crea mediante caracteres de tabulación (no espacios), con el formato <Título del marcador/página de destino[,FitType,TopOffset,LeftOffset] como en el siguiente ejemplo:\nCapítulo 1/23\n[TAB]Para 1.1/25,FitWidth,96\n[TAB][TAB]Para 1.1.1/26,FitHeight,43\nCapítulo 2/30,TopLeft,120,42\n[TAB]Para 2.1/32,FitPage.\nTambién es posible usar un formato extendido para especificar el estilo del texto, el color y el estado abierto o cerrado del marcador, como en el siguiente ejemplo:\nPara 1.1/25,Red,bold,italic,open,FitWidth,96 o\nPara 1.1/25,Green,noBold,noItalic,closed,FitWidth,96
