TOOLBAR_HIDE_ALL=Alle ausblenden
TOOLBAR_SHOW_ALL=Alle anzeigen
AI_INDEX_DIALOG_TITLE=Lesezeichen aus dem Index extrahieren (KI)
AI_INDEX_INTRO=Dieses Werkzeug liest das <b>gedruckte Inhaltsverzeichnis</b> in Ihrem PDF und erstellt Lesezeichen mit <b>künstlicher Intelligenz</b>.<br><br>Sie können <b>dieses Fenster geöffnet lassen</b>, während Sie im Hauptfenster scrollen, um herauszufinden, wo der Index beginnt und endet. Stellen Sie unten die Seitenzahlen ein und klicken Sie dann auf <b>Analysieren</b>. Wenn die Verarbeitung abgeschlossen ist, können Sie das Ergebnis in den Lesezeichenbaum übernehmen. Schließen Sie dieses Fenster, wenn Sie es nicht mehr benötigen.
AI_INDEX_DESTINATION_NOTE=Erstellte Lesezeichen verweisen standardmäßig auf den oberen Rand der PDF-Seite, die den jeweiligen Titel enthält, mit der Ansicht <b>An Breite anpassen</b>. Der Zielseiten-Versatz und alle anderen Lesezeicheneigenschaften können später mit den JPdfBookmarks-Werkzeugen geändert werden.
AI_INDEX_SECTION_RANGE=Indexseiten und Seitenkorrektur
AI_INDEX_START_PAGE=Erste Indexseite
AI_INDEX_START_PAGE_HINT=Die erste PDF-Seite, auf der der Index erscheint (verwenden Sie dieselben Seitennummern wie in der Viewer-Werkzeugleiste oder Statusleiste).
AI_INDEX_END_PAGE=Letzte Indexseite
AI_INDEX_END_PAGE_HINT=Die letzte Seite, die noch zum Index gehört. Wenn sich der Index über mehrere Seiten erstreckt, schließen Sie alle in diesen Bereich ein.
AI_INDEX_PAGE_OFFSET=Seitennummern-Versatz
AI_INDEX_PAGE_OFFSET_HINT=Dieser Wert wird zu jeder von der KI zurückgegebenen Seitennummer <b>addiert</b>. Lassen Sie 0, wenn die gedruckten Seitennummern mit dem PDF übereinstimmen. Verwenden Sie einen positiven oder negativen Wert, wenn sie abweichen (zum Beispiel römisch nummerierter Vorspann oder ein separates Deckblatt).
AI_INDEX_CLOSE=Schließen
AI_INDEX_ANALYZE=Analysieren
AI_INDEX_NO_DOCUMENT=Es ist kein PDF-Dokument geöffnet.
AI_INDEX_BAD_RANGE=Die Startseite darf nicht größer als die Endseite sein.
AI_INDEX_ERROR_TITLE=KI-Indexextraktion
AI_INDEX_UNEXPECTED_ERROR=Ein unerwarteter Fehler ist aufgetreten.
AI_INDEX_NO_BOOKMARKS_EXTRACTED=Es wurden keine Lesezeichen extrahiert.
AI_INDEX_MERGE_PROMPT=Wie sollen die extrahierten Lesezeichen angewendet werden?
AI_INDEX_MERGE_APPEND=An vorhandene Lesezeichen anhängen
AI_INDEX_MERGE_REPLACE=Alle Lesezeichen ersetzen
AI_INDEX_SET_CURRENT_START_TIP=Dieses Feld auf die aktuell im Hauptviewer angezeigte PDF-Seite setzen (Seitennummer beginnend bei 1).
AI_INDEX_SET_CURRENT_END_TIP=Dieses Feld auf die aktuell im Hauptviewer angezeigte PDF-Seite setzen (Seitennummer beginnend bei 1).
AI_INDEX_SET_CURRENT_NO_VIEW=Kein PDF-Viewer verfügbar. Verwenden Sie die Spinner, um Seitenzahlen manuell einzugeben.
AI_INDEX_SET_CURRENT_NO_PAGE=Der Viewer hat keine gültige Seitenzahl gemeldet.
AI_INDEX_SET_CURRENT_CLAMPED=Der Viewer steht auf Seite %d, die außerhalb des zulässigen Bereichs liegt; das Feld wurde auf %d gesetzt.
AI_INDEX_CLOUD_NO_TASK_ID=Der Cloud-Dienst hat keine task id zurückgegeben. Prüfen Sie die process-index-Antwort und Ihre Edge Function.
AI_INDEX_CLOUD_PREVIEW_NOTE=Für die Cloud-Extraktion gelten strengere Grenzen pro Anfrage. Wenn Sie mehr als {0} Indexseiten auswählen, werden Sie aufgefordert, den Bereich einzugrenzen (kostenlose Vorschau und Serverschutz).
AI_INDEX_CLOUD_PAGE_LIMIT_CONFIRM=Der Indexbereich umfasst {0} Seiten. Für die Cloud-Extraktion verwenden Sie höchstens {1} Seiten pro Anfrage. Auf die Seiten {2}–{3} eingrenzen und fortfahren?
AI_INDEX_CLOUD_CONSENT_MESSAGE=Die ausgewählten Indexseiten werden zur KI-Verarbeitung an einen externen Server gesendet.<br><br>JPdfBookmarks lädt ein Bild der ausgewählten Seiten sowie jeden von diesen Seiten extrahierten Text hoch. Fahren Sie nur fort, wenn Sie berechtigt sind, den Inhalt dieses Dokuments an einen Drittanbieterdienst zu senden.
AI_INDEX_CLOUD_CONSENT_REMEMBER=Auf diesem Gerät nicht mehr nachfragen für Cloud-Indexextraktion
AI_INDEX_CLOUD_CONSENT_CONTINUE=In die Cloud senden
AI_INDEX_CLOUD_CONSENT_PRIVACY_BUTTON=Datenschutzhinweis
