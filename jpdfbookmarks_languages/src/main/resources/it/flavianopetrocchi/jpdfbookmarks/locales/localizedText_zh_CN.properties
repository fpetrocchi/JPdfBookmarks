
APP_DESCR=\n用于在现有 PDF 档案上建立或编辑书签的工具程式。若要启动图形介面请在不带参数下执行，或传入你想处理的 pdf 档案作为参数。在 Windows 上，命令列程式必须以 jpdfbookmarks_cli.exe 呼叫，而图形介面必须以 jpdfbookmarks.exe 呼叫。\n
DUMP_DESCR=从作为参数传入的 PDF 档案撷取书签，并输出到标准输出或用 --out 指定的档案。文字档编码可用 --encoding 选项变更。
APPLY_DESCR=将 bookmarks.txt 档案中的书签套用到作为参数传入的 pdf 档案，并储存为以 --out output.pdf 指定的新 pdf 档案。读取 bookmarks.txt 的编码可用 --encoding 选项变更。
OUT_DESCR=搭配 --apply 使用时表示输出 PDF 档案（--out file.pdf 或 -o file.pdf）。搭配 --dump 使用时可表示输出书签档案（--out bookmarks.txt 或 -o bookmarks.txt），也可与 --encoding 一起使用以覆写文字档的系统预设编码。
BOOKMARKS_DESCR=\n在 bookmarks.txt 档案中，每一行是一个书签，阶层以 tab 字元（不是空白）表示，格式为 <书签标题/目标页码[,FitType,TopOffset,LeftOffset]，如下例：\nChapter 1/23\n[TAB]Para 1.1/25,FitWidth,96\n[TAB][TAB]Para 1.1.1/26,FitHeight,43\nChapter 2/30,TopLeft,120,42\n[TAB]Para 2.1/32,FitPage.\n也可使用扩充格式来指定文字样式、颜色与书签展开或收合状态，如下例：\nPara 1.1/25,Red,bold,italic,open,FitWidth,96 或\nPara 1.1/25,Green,noBold,noItalic,closed,FitWidth,96
