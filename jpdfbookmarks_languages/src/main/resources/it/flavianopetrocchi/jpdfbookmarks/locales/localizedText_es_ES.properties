AI_INDEX_CLOUD_CONSENT_MESSAGE=Las páginas de índice seleccionadas se enviarán a un servidor externo para su procesamiento con IA.<br><br>JPdfBookmarks sube una imagen de las páginas seleccionadas y cualquier texto extraído de esas páginas. Continúe solo si está autorizado a enviar el contenido de este documento a un servicio de terceros.
