AI_INDEX_DIALOG_TITLE=Extraire les signets à partir de l'index (IA)
AI_INDEX_INTRO=Cet outil lit la <b>table des matières imprimée</b> dans votre PDF et crée des signets à l'aide de <b>l'intelligence artificielle</b>.<br><br>Vous pouvez <b>laisser cette fenêtre ouverte</b> pendant que vous parcourez la fenêtre principale pour repérer où l'index commence et se termine. Définissez les numéros de page ci-dessous, puis cliquez sur <b>Analyser</b>. Une fois le traitement terminé, vous pourrez fusionner le résultat dans l'arborescence des signets. Fermez cette fenêtre lorsque vous n'en avez plus besoin.
AI_INDEX_DESTINATION_NOTE=Les signets créés pointeront par défaut vers le haut de la page PDF contenant chaque titre, avec le mode d'affichage <b>Ajuster à la largeur</b>. Le décalage du numéro de page cible et toutes les autres propriétés des signets pourront être modifiés par la suite avec les outils JPdfBookmarks.
AI_INDEX_SECTION_RANGE=Pages d'index et correction de page
AI_INDEX_START_PAGE=Première page d'index
AI_INDEX_START_PAGE_HINT=La première page PDF où l'index apparaît (utilisez les mêmes numéros de page que dans la barre d'outils du visualiseur ou la barre d'état).
AI_INDEX_END_PAGE=Dernière page d'index
AI_INDEX_END_PAGE_HINT=La dernière page qui fait encore partie de l'index. Si l'index s'étend sur plusieurs pages, incluez-les toutes dans cette plage.
AI_INDEX_PAGE_OFFSET=Décalage du numéro de page
AI_INDEX_PAGE_OFFSET_HINT=Cette valeur est <b>ajoutée</b> à chaque numéro de page renvoyé par l'IA. Laissez 0 lorsque les numéros imprimés correspondent au PDF. Utilisez une valeur positive ou négative lorsqu'ils diffèrent (par exemple un préliminaire en chiffres romains ou une couverture comptée à part).
AI_INDEX_CLOSE=Fermer
AI_INDEX_ANALYZE=Analyser
AI_INDEX_NO_DOCUMENT=Aucun document PDF n'est ouvert.
AI_INDEX_BAD_RANGE=La page de début ne peut pas être supérieure à la page de fin.
AI_INDEX_ERROR_TITLE=Extraction de l'index IA
AI_INDEX_UNEXPECTED_ERROR=Une erreur inattendue s'est produite.
AI_INDEX_NO_BOOKMARKS_EXTRACTED=Aucun signet n'a été extrait.
AI_INDEX_MERGE_PROMPT=Comment les signets extraits doivent-ils être appliqués ?
AI_INDEX_MERGE_APPEND=Ajouter aux signets existants
AI_INDEX_MERGE_REPLACE=Remplacer tous les signets
AI_INDEX_SET_CURRENT_START_TIP=Définir ce champ sur la page PDF actuellement affichée dans le visualiseur principal (numéro de page commençant à 1).
AI_INDEX_SET_CURRENT_END_TIP=Définir ce champ sur la page PDF actuellement affichée dans le visualiseur principal (numéro de page commençant à 1).
AI_INDEX_SET_CURRENT_NO_VIEW=Aucun visualiseur PDF n'est disponible. Utilisez les sélecteurs pour saisir les numéros de page manuellement.
AI_INDEX_SET_CURRENT_NO_PAGE=Le visualiseur n'a pas fourni de numéro de page valide.
AI_INDEX_SET_CURRENT_CLAMPED=Le visualiseur est sur la page %d, hors de la plage autorisée ; le champ a été défini sur %d.
AI_INDEX_CLOUD_NO_TASK_ID=Le service cloud n'a pas renvoyé d'identifiant de tâche. Vérifiez la réponse de process-index et votre Edge Function.
AI_INDEX_CLOUD_PREVIEW_NOTE=L'extraction cloud applique des limites plus strictes par requête. Si vous sélectionnez plus de {0} pages d'index, il vous sera demandé de réduire la plage (aperçu gratuit et protection du serveur).
AI_INDEX_CLOUD_PAGE_LIMIT_CONFIRM=La plage d'index est de {0} pages. Pour l'extraction cloud, utilisez au plus {1} pages par requête. Réduire à la plage {2}–{3} et continuer ?
AI_INDEX_CLOUD_CONSENT_MESSAGE=Les pages d'index sélectionnées seront envoyées à un serveur externe pour traitement par IA.<br><br>JPdfBookmarks téléverse une image des pages sélectionnées ainsi que tout texte extrait de ces pages. Continuez uniquement si vous êtes autorisé à envoyer le contenu de ce document à un service tiers.
AI_INDEX_CLOUD_CONSENT_REMEMBER=Ne plus demander sur cet appareil pour l'extraction cloud de l'index
AI_INDEX_CLOUD_CONSENT_CONTINUE=Envoyer vers le cloud
AI_INDEX_CLOUD_CONSENT_PRIVACY_BUTTON=Avis de confidentialité
