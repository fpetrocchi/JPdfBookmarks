AI_INDEX_END_PAGE=Última página del índice
AI_INDEX_END_PAGE_HINT=La última página que todavía pertenece al índice. Si el índice ocupa varias páginas, inclúyalas todas en este intervalo.
AI_INDEX_PAGE_OFFSET=Desplazamiento del número de página
AI_INDEX_PAGE_OFFSET_HINT=Este valor se <b>añade</b> a cada número de página devuelto por la IA. Déjelo en 0 cuando los números impresos coincidan con el PDF. Use un valor positivo o negativo cuando difieran (por ejemplo, prólogo con numeración romana o una portada aparte).
