AI_OPTIONS_CLOUD_ANON_KEY=Clave anon de Supabase (pública)
AI_OPTIONS_CLOUD_ANON_KEY_HINT=Pegue solo el JWT anon (empieza por eyJ…), sin la palabra Bearer. Debe pertenecer al mismo proyecto que sus URL de funciones.
AI_CLOUD_HTTP_401_HINT=El servidor rechazó la clave (401). En Supabase Dashboard → Project Settings → API, copie de nuevo la clave anon public en Opciones. No anteponga Bearer (la aplicación lo añade). Si ha rotado las claves, actualice también el valor guardado.
AI_CLOUD_HTTP_UPSTREAM_OPENAI_HINT=El error JSON muestra que OpenAI rechazó la solicitud de su Edge Function (a menudo HTTP 401: permisos insuficientes, scopes como model.request ausentes o una API key con rol de solo lectura). Corríjalo en el servidor: configure OPENAI_API_KEY (o su secreto) con una clave de https://platform.openai.com/api-keys con acceso al modelo que llama, o ajuste los roles de organización/proyecto. Esta no es la clave anon de Supabase de las Opciones de JPdfBookmarks.
AI_OPTIONS_CLOUD_CHECK_URL=URL para comprobar el pago (opcional)
AI_OPTIONS_CLOUD_FETCH_FULL_URL=URL para obtener resultados completos (después del pago)
AI_OPTIONS_CLOUD_STRIPE_MINI_URL=URL de Stripe checkout (estándar)
AI_OPTIONS_CLOUD_STRIPE_ADVANCED_URL=URL de Stripe checkout (advanced)
AI_OPTIONS_CLOUD_STRIPE_ADVANCED_HINT=Haga que esta URL apunte a su precio/producto Advanced de Stripe. El webhook del servidor clasifica Advanced usando STRIPE_ADVANCED_PRICE_IDS y los metadatos del precio; deben coincidir con el checkout que abra desde aquí.
AI_OPTIONS_CLOUD_STRIPE_PRICES_URL=URL del catálogo de precios de Stripe (opcional)
AI_OPTIONS_CLOUD_STRIPE_PRICES_HINT=Si se establece, la aplicación realiza una petición GET a esta URL (con los mismos encabezados Bearer y apikey de Supabase) y espera un JSON como { "standard": { "unit_amount": 115, "currency": "eur" }, "advanced": { "unit_amount": 355, "currency": "eur" } } (unidades menores al estilo Stripe). Impleméntelo como una Edge Function que lea sus precios de Stripe con la clave secreta, para que los importes mostrados se actualicen sin distribuir un nuevo JAR. Déjelo vacío para usar las cadenas fijas AI_PREVIEW_STANDARD_PRICE / AI_PREVIEW_ADVANCED_PRICE de este paquete de idioma. Si está vacío y la URL Check payment termina en …/check-payment, la aplicación usa automáticamente el mismo host con …/stripe-catalog-prices.
