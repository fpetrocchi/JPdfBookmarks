
APP_DESCR=\n用於在現有 PDF 檔案上建立或編輯書籤的工具程式。若要啟動圖形介面請在不帶參數下執行，或傳入你想處理的 pdf 檔案作為參數。在 Windows 上，命令列程式必須以 jpdfbookmarks_cli.exe 呼叫，而圖形介面必須以 jpdfbookmarks.exe 呼叫。\n
DUMP_DESCR=從作為參數傳入的 PDF 檔案擷取書籤，並輸出到標準輸出或用 --out 指定的檔案。文字檔編碼可用 --encoding 選項變更。
APPLY_DESCR=將 bookmarks.txt 檔案中的書籤套用到作為參數傳入的 pdf 檔案，並儲存為以 --out output.pdf 指定的新 pdf 檔案。讀取 bookmarks.txt 的編碼可用 --encoding 選項變更。
OUT_DESCR=搭配 --apply 使用時表示輸出 PDF 檔案（--out file.pdf 或 -o file.pdf）。搭配 --dump 使用時可表示輸出書籤檔案（--out bookmarks.txt 或 -o bookmarks.txt），也可與 --encoding 一起使用以覆寫文字檔的系統預設編碼。
BOOKMARKS_DESCR=\n在 bookmarks.txt 檔案中，每一行是一個書籤，階層以 tab 字元（不是空白）表示，格式為 <書籤標題/目標頁碼[,FitType,TopOffset,LeftOffset]，如下例：\nChapter 1/23\n[TAB]Para 1.1/25,FitWidth,96\n[TAB][TAB]Para 1.1.1/26,FitHeight,43\nChapter 2/30,TopLeft,120,42\n[TAB]Para 2.1/32,FitPage.\n也可使用擴充格式來指定文字樣式、顏色與書籤展開或收合狀態，如下例：\nPara 1.1/25,Red,bold,italic,open,FitWidth,96 或\nPara 1.1/25,Green,noBold,noItalic,closed,FitWidth,96
