AI_CLOUD_HTTP_403_HINT=請在選項中確認雲端 URL 為指向 Supabase 專案的完整 HTTPS（…/functions/v1/…）。關閉 VPN 或公司代理再試，並確認防火牆未攔截 Java。若使用自訂網域，須將 POST/GET 轉送到 Edge Functions。
AI_CLOUD_HTTP_UPSTREAM_OPENAI_HINT=此 JSON 錯誤表示 OpenAI 拒絕了來自 Edge Function 的請求（常見為 HTTP 401：權限不足、缺少 model.request scope，或 API 金鑰僅具唯讀角色）。請在伺服器端修正：將 OPENAI_API_KEY（或使用中的密鑰）設定為來自 https://platform.openai.com/api-keys 且可存取所呼叫模型的金鑰，或調整組織/專案角色。這不是 JPdfBookmarks 選項中的 Supabase anon 金鑰。
