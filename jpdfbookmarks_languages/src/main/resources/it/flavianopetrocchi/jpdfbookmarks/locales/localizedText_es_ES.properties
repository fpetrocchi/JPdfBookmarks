AI_OPTIONS_OPENAI_MODEL_MINI_ONLY=La extracción del índice usa solo gpt-5.4-mini para que los costes en la nube y en local se mantengan dentro del precio estándar del producto. La Edge Function debe leer el campo openai_model del JSON de process-index.
