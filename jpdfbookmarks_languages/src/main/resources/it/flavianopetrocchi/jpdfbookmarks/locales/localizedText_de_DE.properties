
APP_DESCR=\nDienstprogramm zum Erstellen oder Bearbeiten von Lesezeichen in vorhandenen PDF-Dateien. Um die grafische Oberfläche zu starten, rufen Sie das Programm ohne Parameter auf oder übergeben Sie eine PDF-Datei als Parameter. Unter Windows muss das Kommandozeilenprogramm mit jpdfbookmarks_cli.exe gestartet werden, während die grafische Oberfläche mit jpdfbookmarks.exe gestartet werden muss.\n
DUMP_DESCR=Extrahiert Lesezeichen aus einer als Argument übergebenen PDF-Datei und gibt sie auf die Standardausgabe oder in eine mit der Option --out angegebene Datei aus. Die Kodierung der Textdatei kann mit der Option --encoding geändert werden.
APPLY_DESCR=Wendet die Lesezeichen aus der Datei bookmarks.txt auf eine als Argument übergebene PDF-Datei an und speichert sie als neue PDF-Datei, die mit --out output.pdf angegeben wird. Die Kodierung zum Lesen der Datei bookmarks.txt kann mit der Option --encoding geändert werden.
OUT_DESCR=Bei Verwendung mit der Option --apply wird die Ausgabedatei im PDF-Format angegeben (--out file.pdf oder -o file.pdf). Bei Verwendung mit der Option --dump kann die Ausgabedatei für Lesezeichen angegeben werden (--out bookmarks.txt oder -o bookmarks.txt) und sie kann zusammen mit der Option --encoding verwendet werden, um die Standard-Kodierung des Systems für die Textdatei zu überschreiben.
BOOKMARKS_DESCR=\nIn der Datei bookmarks.txt ist jede Zeile ein Lesezeichen; die Hierarchie wird durch Tabulatorzeichen (nicht durch Leerzeichen) gebildet, im Format <Titel des Lesezeichens/Zielseite[,FitType,TopOffset,LeftOffset] wie im folgenden Beispiel:\nKapitel 1/23\n[TAB]Para 1.1/25,FitWidth,96\n[TAB][TAB]Para 1.1.1/26,FitHeight,43\nKapitel 2/30,TopLeft,120,42\n[TAB]Para 2.1/32,FitPage.\nEs ist auch möglich, ein erweitertes Format zu verwenden, um Textstil, Farbe sowie den geöffneten oder geschlossenen Zustand des Lesezeichens anzugeben, wie im folgenden Beispiel:\nPara 1.1/25,Red,bold,italic,open,FitWidth,96 oder\nPara 1.1/25,Green,noBold,noItalic,closed,FitWidth,96
HELP_DESCR=Gibt diese Meldung aus.
VERSION_DESCR=Versionsnummer.
ERROR_PDF_ENCRYPTED=jpdfbookmarks kann verschlüsselte Dateien nicht verarbeiten.
ERR_NO_OUT_FOR_APPLY=Der Modus apply benötigt das Argument --out fileout.pdf.
PAGE_SEP_DESCR=Zeichenfolge, die zwischen Titel und Seitennummer verwendet wird (Standardwert '/'); sie muss sich vom Attributtrenner (Standardwert ',') und von der Einrückungszeichenfolge (Standardwert: Tabulatorzeichen) unterscheiden.
ATTRIBUTES_SEP_DESCR=Zeichenfolge, die zwischen den Lesezeichenattributen verwendet wird (Standardwert ','); sie muss sich vom Trenner zwischen Titel und Seitennummer (Standardwert '/') und von der Einrückungszeichenfolge (Standardwert: Tabulatorzeichen) unterscheiden.
INDENTATION_STRING_DESCR=Zeichenfolge, die als Einrückung verwendet wird (Standardwert: Tabulatorzeichen); sie muss sich vom Trenner zwischen Titel und Seitennummer (Standardwert '/') und vom Attributtrenner (Standardwert ',') unterscheiden.
ERR_OPTIONS_CONTRAST=Optionskonflikt. Denken Sie daran, dass --attributes-sep, --page-sep und --indentation unterschiedliche Zeichenfolgen sein müssen.
