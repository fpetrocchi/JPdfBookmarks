AI_OPTIONS_CLOUD_STRIPE_ADVANCED_HINT=Faites pointer cette URL vers votre prix/produit Stripe Advanced. Le webhook du serveur classe Advanced à l'aide de STRIPE_ADVANCED_PRICE_IDS et des métadonnées du prix ; elles doivent correspondre au checkout ouvert depuis ici.
AI_OPTIONS_CLOUD_STRIPE_PRICES_URL=URL du catalogue de prix Stripe (optionnel)
AI_OPTIONS_CLOUD_STRIPE_PRICES_HINT=Si elle est définie, l'application effectue une requête GET vers cette URL (avec les mêmes en-têtes Bearer et apikey Supabase) et attend un JSON du type { "standard": { "unit_amount": 115, "currency": "eur" }, "advanced": { "unit_amount": 355, "currency": "eur" } } (unités mineures au style Stripe). Implémentez-la comme une Edge Function qui lit vos prix Stripe avec la clé secrète, afin que les montants affichés se mettent à jour sans distribuer un nouveau JAR. Laissez vide pour utiliser les chaînes fixes AI_PREVIEW_STANDARD_PRICE / AI_PREVIEW_ADVANCED_PRICE de ce pack de langue. Si vide et que l'URL Check payment se termine par …/check-payment, l'application utilise automatiquement le même hôte avec …/stripe-catalog-prices.
AI_OPTIONS_CLOUD_PROCESS_MODEL=Modèle d'extraction cloud (process-index)
AI_OPTIONS_CLOUD_URL_HINT=Utilisez des URL HTTPS complètes vers vos Edge Functions. La clé anon est envoyée dans les en-têtes Bearer et apikey.
AI_ERROR_CLOUD_EXTRACTION_HINT=L'extraction cloud est sélectionnée mais l'URL process ou la clé anon est vide. Complétez la section Cloud dans Options (Intelligence artificielle) ou revenez à Local.
AI_PREVIEW_WINDOW_TITLE=Aperçu des signets IA
AI_PREVIEW_INDEX_PANEL_TITLE=Aperçu de l'index
AI_PREVIEW_TREE_ROOT=Index
AI_PREVIEW_CARD_STANDARD_TITLE=Modèle IA standard
AI_PREVIEW_CARD_STANDARD_BODY=L'IA a créé des signets à partir des pages d'aperçu de l'index. Environ 30 % sont visibles dans l'arborescence : cliquez sur un élément pour accéder à cette page dans le visualiseur. Après paiement, vous obtenez le plan complet pour la plage de pages d'index initialement sélectionnée.
AI_PREVIEW_LOCKED_NODE=*** Achetez pour déverrouiller ***
AI_PREVIEW_CARD_ADVANCED_TITLE=Modèle IA avancé
AI_PREVIEW_CARD_ADVANCED_BODY=Pour les index très denses ou complexes, ou si vous souhaitez la meilleure qualité d'extraction, choisissez le modèle IA avancé.
AI_PREVIEW_STANDARD_PRICE=1,15 €
AI_PREVIEW_ADVANCED_PRICE=3,55 €
AI_PREVIEW_BTN_STANDARD=Déverrouiller le plan complet
AI_PREVIEW_BTN_ADVANCED=Acheter avec l'IA avancée
AI_PREVIEW_CLOSE=Fermer
AI_PREVIEW_POLLING=Vérification du paiement toutes les 5 secondes…
AI_PREVIEW_POLLING_DISABLED=Configurez l'URL check-payment dans Options pour activer la vérification automatique. Une URL fetch-full-results distincte n'est nécessaire que si votre serveur ne renvoie pas les signets dans la réponse check-payment lorsque le paiement est validé.
AI_PREVIEW_PAID_NO_BOOKMARKS_NO_FETCH=Paiement confirmé, mais le serveur n'a renvoyé aucun signet et aucune URL fetch-full-results n'est configurée. Ajoutez-la dans Options ou corrigez check-payment afin qu'il renvoie les signets lorsque paid vaut true.
AI_PREVIEW_FETCH_EMPTY=Le serveur n'a renvoyé aucun signet pour cette tâche.
AI_PREVIEW_PAYMENT_DETECTED=Paiement confirmé. Téléchargement des signets complets…
AI_PREVIEW_WAIT_TASK_TOOLTIP=En attente de l'identifiant de tâche du service cloud.
AI_PREVIEW_STRIPE_URL_MISSING_TOOLTIP=Configurez l'URL Stripe checkout dans Options (Intelligence artificielle).
AI_PREVIEW_MISSING_TASK_ID=La réponse cloud ne contient pas de taskId. Configurez process-index pour le renvoyer ; sans lui, Stripe ne peut pas lier le paiement à cette extraction et les boutons restent désactivés.
AI_PREVIEW_STATUS_NO_TASK=Impossible de vérifier le paiement tant qu'aucun task id n'est disponible.
AI_PREVIEW_CHECKING_SERVER=Vérification sur le serveur pour savoir si cette extraction est déjà payée…
AI_PREVIEW_CHECKING_SERVER_STATUS=Contact du serveur pour l'état du paiement…
AI_PREVIEW_ALREADY_PAID_STATUS=Cette extraction apparaît déjà comme payée sur le serveur. Vous pouvez télécharger les signets achetés.
AI_PREVIEW_ALREADY_PAID_DOWNLOAD_HINT=L'arborescence de gauche montre le plan complet. Cliquez sur le bouton pour appliquer ces signets au PDF (il vous sera demandé de les ajouter ou de remplacer l'arborescence actuelle).
AI_PREVIEW_BTN_DOWNLOAD_PURCHASED=Télécharger les signets achetés
AI_PREVIEW_UPGRADE_STANDARD_HINT=Vous avez déjà débloqué le niveau Standard pour cette extraction. Téléchargez le plan maintenant, ou passez au niveau Advanced pour un affinage IA supplémentaire (paiement séparé). Après paiement d'Advanced, attendez quelques secondes ; cette fenêtre se rafraîchira automatiquement.
AI_PREVIEW_BTN_UPGRADE_ADVANCED=Passer à l'IA avancée
AI_PREVIEW_BTN_ACCEPT_STANDARD_PAID=Utiliser l'index Standard payé
AI_PREVIEW_UPGRADE_POLLING_STATUS=En attente de la confirmation serveur pour la montée en gamme Advanced…
AI_PREVIEW_UPGRADE_COMPLETE_STATUS=La montée en gamme Advanced a été détectée. Téléchargez le plan affiné quand vous le souhaitez.
AI_PREVIEW_PAID_EMPTY_BOOKMARKS_HINT=Le paiement est enregistré mais aucune liste de signets n'a été renvoyée. Essayez le bouton ci-dessous si vous avez configuré une URL distincte pour récupérer les résultats complets.
AI_PREVIEW_FETCH_URL_REQUIRED_TOOLTIP=Configurez l'URL fetch-full-results dans Options.
AI_PREVIEW_REEXTRACT_FULL_INDEX_STATUS=Extraction de l'index complet à partir de toutes les pages sélectionnées (cela peut prendre un certain temps)…
AI_PREVIEW_REEXTRACT_FAILED=Impossible de charger l'index complet depuis le serveur. Les signets de l'extraction d'aperçu seront utilisés à la place.
CHOOSE_NUM_CLICKS=Choisissez un clic simple ou un double clic pour activer les signets
SINGLE_CLICK=Clic simple
DOUBLE_CLICK=Double clic
