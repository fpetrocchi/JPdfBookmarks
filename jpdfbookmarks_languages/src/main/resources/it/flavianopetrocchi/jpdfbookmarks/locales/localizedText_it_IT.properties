AI_OPTIONS_CLOUD_ANON_KEY_HINT=Incolla solo il JWT anon (inizia con eyJ…), senza la parola Bearer. Dev'essere la chiave public dello stesso progetto dell'URL delle funzioni.
AI_CLOUD_HTTP_401_HINT=Il server ha rifiutato la chiave (401). Controlla in Supabase Dashboard → Project Settings → API la «anon public» e incollala di nuovo in Opzioni. Non anteporre Bearer (l'app lo aggiunge da sola). Se hai rigenerato le chiavi, aggiorna anche il valore salvato.
AI_CLOUD_HTTP_403_BLOCKED_BODY=La risposta è una pagina HTML di blocco invece del JSON dell’API — spesso bordo CDN (403), URL errato o rete filtrata.
AI_CLOUD_HTTP_403_HINT=Verifica in Opzioni che gli URL cloud siano HTTPS corretti verso il progetto Supabase (…/functions/v1/…). Prova senza VPN o proxy aziendale e controlla che il firewall non blocchi Java. Un dominio personalizzato davanti a Supabase deve inoltrare POST/GET alle Edge Functions.
AI_CLOUD_HTTP_UPSTREAM_OPENAI_HINT=Il messaggio indica che la Edge Function ha contattato OpenAI, ma OpenAI ha rifiutato la richiesta (spesso 401: permessi insufficienti, scope model.request mancante, o chiave con ruolo di sola lettura). Correggi sul backend la OPENAI_API_KEY (o il segreto usato) con una chiave da https://platform.openai.com/api-keys abilitata al modello richiesto, oppure i ruoli organizzazione/progetto. Non riguarda la chiave anon Supabase nelle Opzioni dell'app.
AI_OPTIONS_CLOUD_CHECK_URL=URL verifica pagamento (opzionale)
AI_OPTIONS_CLOUD_FETCH_FULL_URL=URL download risultati completi (dopo pagamento)
AI_OPTIONS_CLOUD_CREATE_CHECKOUT_URL=URL funzione create-checkout (backend)
AI_OPTIONS_CLOUD_STRIPE_ADVANCED_URL=URL Stripe checkout (advanced)
AI_OPTIONS_CLOUD_STRIPE_ADVANCED_HINT=Collega questo URL al prezzo/prodotto Stripe «advanced». Sul backend la webhook riconosce il tier avanzato tramite STRIPE_ADVANCED_PRICE_IDS e i metadata del prezzo: devono corrispondere al checkout che apri da qui.
AI_OPTIONS_CLOUD_STRIPE_PRICES_URL=URL catalogo prezzi Stripe (opzionale)
AI_OPTIONS_CLOUD_STRIPE_PRICES_HINT=Se impostato, l'app esegue una GET su questo URL (stessi header Bearer/apikey Supabase) e si aspetta JSON tipo { "standard": { "unit_amount": 115, "currency": "eur" }, "advanced": { "unit_amount": 355, "currency": "eur" } } (unità minori come Stripe). Implementa una Edge Function che legge i Price con la chiave segreta Stripe così gli importi in anteprima si aggiornano senza nuovo JAR. Lascia vuoto per usare le stringhe fisse AI_PREVIEW_STANDARD_PRICE / AI_PREVIEW_ADVANCED_PRICE del pacchetto lingua. Se vuoto e l'URL check-payment termina con …/check-payment, l'app usa automaticamente lo stesso host con …/stripe-catalog-prices.
AI_OPTIONS_CLOUD_PROCESS_MODEL=Modello estrazione cloud (process-index)
AI_OPTIONS_CLOUD_URL_HINT=Usa URL HTTPS completi delle Edge Function. La chiave anon viene inviata negli header Authorization (Bearer) e apikey.
AI_ERROR_CLOUD_EXTRACTION_HINT=È selezionata l'estrazione cloud ma mancano l'URL process-index o la chiave anon. Compila la sezione Cloud in Opzioni (Intelligenza artificiale) oppure torna a Locale.
AI_ERROR_CLOUD_EXTRACTION_CONSUMER=Questa installazione non contiene gli endpoint cloud nell'applicazione (al momento del packaging Maven le proprietà ai.cloud.* erano vuote). Ricompila pubblicando gli URL della Edge Function process-index e la chiave anon Supabase, oppure usa un artefatto già configurato. In questa versione non è possibile completare la configurazione da Opzioni.
AI_ERROR_OPENAI_API_KEY=Per usare OpenAI serve una chiave API. Impostala in Opzioni » Intelligenza artificiale (campo chiave API OpenAI), oppure scegli l'estrazione cloud o Ollama in locale.
AI_ERROR_AI_PROVIDER_UNKNOWN=Fornitore IA sconosciuto: "{0}". In Opzioni » Intelligenza artificiale scegli Locale con OpenAI o Ollama, oppure estrazione cloud.
AI_PREVIEW_WINDOW_TITLE=Anteprima segnalibri IA
AI_PREVIEW_INDEX_PANEL_TITLE=Anteprima indice
AI_PREVIEW_TREE_ROOT=Indice
AI_PREVIEW_CARD_STANDARD_TITLE=Modello AI Standard
AI_PREVIEW_CARD_STANDARD_BODY=L'IA ha creato i segnalibri dalle pagine indice di anteprima. Circa il 30% e' visibile nell'albero: clicca una voce per aprire quella pagina nel visualizzatore. Dopo il pagamento ottieni l'outline completo sull'intervallo di pagine indice che avevi scelto.
AI_PREVIEW_LOCKED_NODE=*** Acquista per sbloccare ***
AI_PREVIEW_CARD_ADVANCED_TITLE=Modello AI Avanzato
AI_PREVIEW_CARD_ADVANCED_BODY=Per indici molto densi o complessi, o se vuoi la massima qualità di estrazione, scegli il modello AI avanzato.
AI_PREVIEW_STANDARD_PRICE=1,15 €
AI_PREVIEW_ADVANCED_PRICE=3,55 €
AI_PREVIEW_BTN_STANDARD=Sblocca outline completo
AI_PREVIEW_BTN_ADVANCED=Compra con IA avanzata
AI_PREVIEW_CLOSE=Chiudi
AI_PREVIEW_POLLING=Verifica pagamento ogni 5 secondi…
AI_PREVIEW_POLLING_DISABLED=Configura in Opzioni l'URL della funzione check-payment per abilitare il polling. L'URL di download risultati completi serve solo se il server non restituisce i segnalibri nella risposta check-payment dopo il pagamento.
AI_PREVIEW_PAID_NO_BOOKMARKS_NO_FETCH=Pagamento confermato ma il server non ha restituito segnalibri e non è configurato l'URL di download risultati. Aggiungilo in Opzioni o correggi check-payment affinché con paid=true includa l'array bookmarks.
AI_PREVIEW_FETCH_EMPTY=Il server non ha restituito segnalibri per questa attività.
AI_PREVIEW_PAYMENT_DETECTED=Pagamento confermato. Scaricamento segnalibri completi…
AI_PREVIEW_WAIT_TASK_TOOLTIP=In attesa del task id dal servizio Cloud.
AI_PREVIEW_CHECKOUT_URL_MISSING_TOOLTIP=Configura l'URL della funzione create-checkout in Opzioni (Intelligenza artificiale).
AI_PREVIEW_MISSING_TASK_ID=La risposta Cloud non contiene un taskId. Configura process-index per restituirlo; senza di esso Stripe non collega il pagamento a questa estrazione e i pulsanti restano disabilitati.
AI_PREVIEW_STATUS_NO_TASK=Impossibile verificare il pagamento finché non è disponibile un task id.
AI_PREVIEW_CHECKING_SERVER=Verifica sul server se questa estrazione risulta già pagata…
AI_PREVIEW_CHECKING_SERVER_STATUS=Contatto il server per lo stato del pagamento…
AI_PREVIEW_ALREADY_PAID_STATUS=Questa estrazione risulta già pagata sul server. Puoi scaricare subito i segnalibri acquistati.
AI_PREVIEW_ALREADY_PAID_DOWNLOAD_HINT=L'albero a sinistra mostra l'indice completo. Clicca il pulsante per applicare i segnalibri al PDF (ti verrà chiesto se aggiungerli o sostituire l'albero attuale).
AI_PREVIEW_BTN_DOWNLOAD_PURCHASED=Scarica segnalibri acquistati
AI_PREVIEW_UPGRADE_STANDARD_HINT=Hai già lo sblocco Standard per questa estrazione. Puoi scaricare subito l'indice oppure passare al tier Avanzato per la rifinitura IA (pagamento separato). Dopo il pagamento Avanzato attendi qualche secondo: questa finestra si aggiorna da sola.
AI_PREVIEW_BTN_UPGRADE_ADVANCED=Upgrade a IA avanzata
AI_PREVIEW_BTN_ACCEPT_STANDARD_PAID=Usa indice Standard (già pagato)
AI_PREVIEW_UPGRADE_POLLING_STATUS=In attesa che il server confermi l'upgrade ad Avanzato…
AI_PREVIEW_UPGRADE_COMPLETE_STATUS=Upgrade ad Avanzato rilevato. Scarica l'indice rifinito quando vuoi.
AI_PREVIEW_PAID_EMPTY_BOOKMARKS_HINT=Il pagamento risulta registrato ma non è stato restituito l'elenco segnalibri. Prova il pulsante sotto se hai configurato l'URL di download risultati.
AI_PREVIEW_FETCH_URL_REQUIRED_TOOLTIP=Configura in Opzioni l'URL di download risultati completi.
AI_PREVIEW_REEXTRACT_FULL_INDEX_STATUS=Estrazione dell'indice completo dalle pagine che hai selezionato (può richiedere alcuni minuti)…
AI_PREVIEW_REEXTRACT_FAILED=Impossibile caricare l'indice completo dal server. Verranno applicati i segnalibri dell'anteprima.
CHOOSE_NUM_CLICKS=Scegli click singolo o doppio per attivare i segnaibri
SINGLE_CLICK=Click Singolo
DOUBLE_CLICK=Click Doppio
