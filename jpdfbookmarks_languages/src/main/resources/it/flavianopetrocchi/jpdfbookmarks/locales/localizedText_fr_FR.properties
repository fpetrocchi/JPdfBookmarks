PAGE_SEP_DESCR=Chaîne à utiliser entre le titre et le numéro de page (valeur par défaut '/'), qui doit être différente du séparateur d'attributs (valeur par défaut ',') et de la chaîne d'indentation (valeur par défaut : la tabulation).
ATTRIBUTES_SEP_DESCR=Chaîne à utiliser entre les attributs du signet (valeur par défaut ','), qui doit être différente du séparateur entre le titre et le numéro de page (valeur par défaut '/') et de la chaîne d'indentation (valeur par défaut : la tabulation).
INDENTATION_STRING_DESCR=Chaîne à utiliser comme indentation (valeur par défaut : la tabulation), qui doit être différente du séparateur entre le titre et le numéro de page (valeur par défaut '/') et du séparateur d'attributs (valeur par défaut ',').
