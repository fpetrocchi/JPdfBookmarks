AI_OPTIONS_CLOUD_STRIPE_ADVANCED_HINT=Point this URL at your Stripe Advanced price/product. The server webhook classifies Advanced using STRIPE_ADVANCED_PRICE_IDS and price metadata; they must match the checkout opened from here.
AI_OPTIONS_CLOUD_STRIPE_PRICES_URL=Stripe catalog prices URL (optional)
AI_OPTIONS_CLOUD_STRIPE_PRICES_HINT=If set, the app performs a GET on this URL (same Supabase Bearer and apikey headers) and expects JSON like { "standard": { "unit_amount": 115, "currency": "eur" }, "advanced": { "unit_amount": 355, "currency": "eur" } } (Stripe-style minor units). Implement it as an Edge Function that reads your Stripe Prices with the secret key, so displayed amounts update without shipping a new JAR. Leave empty to use the fixed strings AI_PREVIEW_STANDARD_PRICE / AI_PREVIEW_ADVANCED_PRICE from this language pack. If empty and Check payment URL ends with …/check-payment, the app uses the same host with …/stripe-catalog-prices automatically.
AI_OPTIONS_CLOUD_PROCESS_MODEL=Cloud extraction model (process-index)
AI_OPTIONS_CLOUD_URL_HINT=Use full HTTPS URLs to your Edge Functions. The anon key is sent as Bearer and apikey headers.
