AI_INDEX_DIALOG_TITLE=Extraer marcadores del índice (IA)
AI_INDEX_INTRO=Esta herramienta lee el <b>índice impreso</b> dentro de su PDF y crea marcadores usando <b>Inteligencia Artificial</b>.<br><br>Puede <b>mantener esta ventana abierta</b> mientras se desplaza por la ventana principal para localizar dónde empieza y termina el índice. Configure los números de página a continuación y luego haga clic en <b>Analizar</b>. Cuando termine el procesamiento, podrá fusionar el resultado con el árbol de marcadores. Cierre esta ventana cuando ya no la necesite.
AI_INDEX_DESTINATION_NOTE=Los marcadores creados apuntarán de forma predeterminada a la parte superior de la página PDF que contiene cada título, con vista <b>Ajustar ancho</b>. El desplazamiento de los números de página de destino y todas las demás propiedades de los marcadores podrán modificarse más adelante con las herramientas de JPdfBookmarks.
