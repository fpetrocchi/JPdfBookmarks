AI_INDEX_DESTINATION_NOTE=\u039f\u03b9 \u03b4\u03b7\u03bc\u03b9\u03bf\u03c5\u03c1\u03b3\u03bf\u03cd\u03bc\u03b5\u03bd\u03bf\u03b9 \u03c3\u03b5\u03bb\u03b9\u03b4\u03bf\u03b4\u03b5\u03af\u03ba\u03c4\u03b5\u03c2 \u03b8\u03b1 \u03b4\u03b5\u03af\u03c7\u03bd\u03bf\u03c5\u03bd \u03b1\u03c0\u03cc \u03c0\u03c1\u03bf\u03b5\u03c0\u03b9\u03bb\u03bf\u03b3\u03ae \u03c3\u03c4\u03b7\u03bd \u03ba\u03bf\u03c1\u03c5\u03c6\u03ae \u03c4\u03b7\u03c2 \u03c3\u03b5\u03bb\u03af\u03b4\u03b1\u03c2 PDF \u03c0\u03bf\u03c5 \u03c0\u03b5\u03c1\u03b9\u03ad\u03c7\u03b5\u03b9 \u03ba\u03ac\u03b8\u03b5 \u03c4\u03af\u03c4\u03bb\u03bf, \u03bc\u03b5 \u03c0\u03c1\u03bf\u03b2\u03bf\u03bb\u03ae <b>\u03a4\u03b1\u03af\u03c1\u03b9\u03b1\u03c3\u03bc\u03b1 \u03ba\u03b1\u03c4\u03ac \u03c0\u03bb\u03ac\u03c4\u03bf\u03c2</b>. \u0397 \u03bc\u03b5\u03c4\u03b1\u03c4\u03cc\u03c0\u03b9\u03c3\u03b7 \u03b1\u03c1\u03b9\u03b8\u03bc\u03bf\u03cd \u03c3\u03b5\u03bb\u03af\u03b4\u03b1\u03c2 \u03c0\u03c1\u03bf\u03bf\u03c1\u03b9\u03c3\u03bc\u03bf\u03cd \u03ba\u03b1\u03b9 \u03cc\u03bb\u03b5\u03c2 \u03bf\u03b9 \u03ac\u03bb\u03bb\u03b5\u03c2 \u03b9\u03b4\u03b9\u03cc\u03c4\u03b7\u03c4\u03b5\u03c2 \u03bc\u03c0\u03bf\u03c1\u03bf\u03cd\u03bd \u03bd\u03b1 \u03b1\u03bb\u03bb\u03ac\u03be\u03bf\u03c5\u03bd \u03b1\u03c1\u03b3\u03cc\u03c4\u03b5\u03c1\u03b1 \u03bc\u03b5 \u03c4\u03b1 \u03b5\u03c1\u03b3\u03b1\u03bb\u03b5\u03af\u03b1 \u03c4\u03bf\u03c5 JPdfBookmarks.
AI_INDEX_SECTION_RANGE=Index pages and page correction
AI_INDEX_START_PAGE=First index page
AI_INDEX_START_PAGE_HINT=The first PDF page where the index appears (use the same page numbers as in the viewer toolbar or status bar).
AI_INDEX_END_PAGE=Last index page
AI_INDEX_END_PAGE_HINT=The last page that still belongs to the index. If the index spans several pages, include all of them in this range.
AI_INDEX_PAGE_OFFSET=Page number offset
AI_INDEX_PAGE_OFFSET_HINT=This value is <b>added</b> to every page number returned by the AI. Leave 0 when printed page numbers match the PDF. Use a positive or negative value when they differ (for example Roman-numbered front matter or a separate cover count).
AI_INDEX_CLOSE=Close
AI_INDEX_ANALYZE=Analyze
AI_INDEX_NO_DOCUMENT=No PDF document is open.
AI_INDEX_BAD_RANGE=The start page cannot be greater than the end page.
AI_INDEX_ERROR_TITLE=AI index extraction
AI_INDEX_UNEXPECTED_ERROR=An unexpected error occurred.
AI_INDEX_NO_BOOKMARKS_EXTRACTED=No bookmarks were extracted.
AI_INDEX_MERGE_PROMPT=How should the extracted bookmarks be applied?
AI_INDEX_MERGE_APPEND=Append to existing bookmarks
AI_INDEX_MERGE_REPLACE=Replace all bookmarks
AI_INDEX_SET_CURRENT_START_TIP=Set this field to the PDF page currently shown in the main viewer (1-based page number).
AI_INDEX_SET_CURRENT_END_TIP=Set this field to the PDF page currently shown in the main viewer (1-based page number).
AI_INDEX_SET_CURRENT_NO_VIEW=No PDF viewer is available. Use the spinners to type page numbers manually.
AI_INDEX_SET_CURRENT_NO_PAGE=The viewer did not report a valid page number.
AI_INDEX_SET_CURRENT_CLAMPED=The viewer is on page %d, which is outside the allowed range; the field was set to %d.
AI_INDEX_CLOUD_NO_TASK_ID=The cloud service did not return a task id. Check the process-index response and your Edge Function.
