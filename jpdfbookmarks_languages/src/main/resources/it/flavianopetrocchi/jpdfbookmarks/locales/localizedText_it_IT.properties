AI_OPTIONS_OPENAI_MODEL_MINI_ONLY=L'estrazione indice usa solo gpt-5.4-mini (locale e cloud) per contenere i costi rispetto al prezzo standard. La Edge Function deve usare il campo openai_model nel JSON process-index.
