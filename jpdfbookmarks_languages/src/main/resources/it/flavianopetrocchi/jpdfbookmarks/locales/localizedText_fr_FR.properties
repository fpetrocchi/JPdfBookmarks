
APP_DESCR=\nUtilitaire permettant de créer ou de modifier des signets dans des fichiers PDF existants. Pour lancer l'interface graphique, exécutez-le sans paramètres ou passez un fichier PDF en paramètre. Sous Windows, le programme en ligne de commande doit être lancé avec jpdfbookmarks_cli.exe, tandis que l'interface graphique doit être lancée avec jpdfbookmarks.exe.\n
DUMP_DESCR=Extrait les signets d'un fichier PDF passé en argument et les affiche sur la sortie standard ou dans un fichier indiqué avec l'option --out. L'encodage du fichier texte peut être modifié avec l'option --encoding.
APPLY_DESCR=Applique les signets du fichier bookmarks.txt à un fichier PDF passé en argument et l'enregistre dans un nouveau fichier PDF indiqué avec --out output.pdf. L'encodage pour lire le fichier bookmarks.txt peut être modifié avec l'option --encoding.
OUT_DESCR=Utilisé avec l'option --apply, indique le fichier PDF de sortie (--out file.pdf ou -o file.pdf). Utilisé avec l'option --dump, peut indiquer le fichier texte de signets de sortie (--out bookmarks.txt ou -o bookmarks.txt) et peut être combiné avec l'option --encoding pour remplacer l'encodage texte par défaut du système.
BOOKMARKS_DESCR=\nDans le fichier bookmarks.txt, chaque ligne est un signet et la hiérarchie est créée à l'aide de caractères de tabulation (et non d'espaces), au format <Titre du signet/page cible[,FitType,TopOffset,LeftOffset] comme dans l'exemple suivant :\nChapitre 1/23\n[TAB]Para 1.1/25,FitWidth,96\n[TAB][TAB]Para 1.1.1/26,FitHeight,43\nChapitre 2/30,TopLeft,120,42\n[TAB]Para 2.1/32,FitPage.\nIl est également possible d'utiliser un format étendu pour préciser le style du texte, la couleur et l'état ouvert ou fermé du signet, comme dans l'exemple suivant :\nPara 1.1/25,Red,bold,italic,open,FitWidth,96 ou\nPara 1.1/25,Green,noBold,noItalic,closed,FitWidth,96
