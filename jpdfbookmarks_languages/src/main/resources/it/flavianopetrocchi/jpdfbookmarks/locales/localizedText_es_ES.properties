VERSION_DESCR=Número de versión.
ERROR_PDF_ENCRYPTED=jpdfbookmarks no puede procesar archivos cifrados.
ERR_NO_OUT_FOR_APPLY=El modo apply necesita el argumento --out fileout.pdf.
PAGE_SEP_DESCR=Cadena que se usa entre el título y el número de página (el valor predeterminado es '/'); debe ser distinta del separador de atributos (valor predeterminado ',') y de la cadena de sangría (valor predeterminado: el carácter de tabulación).
ATTRIBUTES_SEP_DESCR=Cadena que se usa entre los atributos del marcador (valor predeterminado ','), debe ser distinta del separador entre título y número de página (valor predeterminado '/') y de la cadena de sangría (valor predeterminado: el carácter de tabulación).
INDENTATION_STRING_DESCR=Cadena que se usa como sangría (valor predeterminado: el carácter de tabulación); debe ser distinta del separador entre título y número de página (valor predeterminado '/') y del separador de atributos (valor predeterminado ',').
